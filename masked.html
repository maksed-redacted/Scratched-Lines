<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#17110E"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="MaskED HQ"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><script src="pwa.js" data-app="masked" data-caps="db,downloads"></script><style>.pwa-home{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;text-decoration:none;font:600 18px/1 system-ui,sans-serif;border:1px solid currentColor;opacity:.75;-webkit-tap-highlight-color:transparent}.pwa-home:active{transform:scale(.92)}</style><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>MaskED HQ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: torn black "blindfold" band header with the paper-cut M, sticky tab strip, single-column workspace on cream paper */
:root{
  --paper:#F2E4D0; --card:#FBF4EA; --sunk:#EADAC2; --ink:#1C1512; --muted:#6B5B4E; --line:#D9C5AB;
  --red:#BF3328; --on-red:#FFF5EA; --gold:#B5862C; --blue:#1B3A6B; --ok:#2F7343; --warn:#A8670F;
  --band:#17110E; --band-ink:#F2E4D0;
  --f-display:"Archivo Black","Arial Black",Impact,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#14100E; --card:#1E1815; --sunk:#271F1A; --ink:#F1E3D0; --muted:#A99786; --line:#3A2E27;
  --red:#DC4A3D; --on-red:#1A0F0C; --gold:#D6AA4F; --blue:#7D9DD6; --ok:#6DB47E; --warn:#E3A548;
  --band:#060404; --band-ink:#F1E3D0; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#14100E; --card:#1E1815; --sunk:#271F1A; --ink:#F1E3D0; --muted:#A99786; --line:#3A2E27;
  --red:#DC4A3D; --on-red:#1A0F0C; --gold:#D6AA4F; --blue:#7D9DD6; --ok:#6DB47E; --warn:#E3A548;
  --band:#060404; --band-ink:#F1E3D0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header band */
.band{background:var(--band);color:var(--band-ink);padding-block:18px 30px;
  clip-path:polygon(0 0,100% 0,100% 86%,97% 93%,93% 85%,89% 95%,84% 87%,79% 96%,74% 86%,69% 94%,63% 87%,58% 97%,52% 88%,47% 95%,41% 85%,36% 94%,30% 87%,25% 96%,19% 86%,14% 94%,8% 87%,4% 95%,0 88%)}
.band .wrap{display:flex;align-items:center;gap:14px}
.logo{width:62px;height:auto;border-radius:6px;transform:rotate(-3deg);box-shadow:3px 4px 0 rgba(0,0,0,.45);flex:none}
.brand h1{font:400 26px/1 var(--f-display);margin:0;letter-spacing:.5px}
.brand h1 b{color:var(--red);font-weight:400}
.brand p{margin:4px 0 0;font:500 12px/1.3 var(--f-mono);letter-spacing:.06em;opacity:.75;text-transform:uppercase}
.goldrule{height:4px;background:var(--gold);margin:4px auto 0;max-width:1080px;border-radius:1px;opacity:.9}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:8px}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:8px 12px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{background:var(--ink);color:var(--paper)}

main{padding-block:20px 80px}
h2{font:400 24px/1.15 var(--f-display);margin:0;text-wrap:balance}
h3{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}

.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{color:var(--red);border-color:var(--red);background:none}
.btn.sm{padding:5px 10px;font-size:13px}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0}
textarea{resize:vertical;min-height:84px;line-height:1.55}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--red)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
label.f>*{text-transform:none;letter-spacing:0;font-weight:400;font-size:15px;color:var(--ink)}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.st{border:0;color:var(--on-red)}
.st-Idea{background:var(--sunk);color:var(--muted)}
.st-Scripting{background:var(--blue);color:var(--paper)}
.st-Shooting{background:var(--gold);color:var(--band)}
.st-Editing{background:var(--red)}
.st-Scheduled{background:var(--ink);color:var(--paper)}
.st-Published{background:var(--ok);color:var(--paper)}
.wc-ok{color:var(--ok);border-color:var(--ok)}
.wc-off{color:var(--warn);border-color:var(--warn)}

/* idea cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;min-width:0}
.card:hover{border-color:var(--ink)}
.card h4{margin:0;font-size:16px;line-height:1.3;font-weight:700;text-wrap:balance}
.card .meta{font-size:12px;color:var(--muted)}
.card .last{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* dashboard */
.today{background:var(--band);color:var(--band-ink);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.today .k{font:600 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.today .series{font:400 30px/1.05 var(--f-display);color:var(--band-ink)}
.today .series span{color:var(--red)}
.today .assigned{font-size:15px;opacity:.9}
.today .btn{background:transparent;color:var(--band-ink);border-color:rgba(242,228,208,.35)}
.today .btn.primary{background:var(--red);border-color:var(--red);color:#FFF5EA}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{display:block;font:600 26px/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.pipestrip{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--sunk)}
.pipestrip i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;background:var(--c)}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.li:first-child{border-top:0}
.li .t{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--muted);font-size:14px;padding:18px;border:1px dashed var(--line);border-radius:var(--r);text-align:center}

/* pipeline */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;scroll-snap-align:start;min-height:120px}
.col>header{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 4px}
.col .card{gap:6px;padding:12px}
.mv{display:flex;gap:6px}
.mv button{flex:1}

/* schedule */
.week{display:flex;flex-direction:column;gap:8px}
.day{display:grid;grid-template-columns:92px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.day.is-today{border-color:var(--red);box-shadow:inset 4px 0 0 var(--red)}
.day .dn{font:400 15px var(--f-display)}
.day .dd{font:12px var(--f-mono);color:var(--muted)}
.day .sr{font-weight:700;font-size:14px;margin-bottom:6px}
.day .fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-width:0}
.tick{width:30px;height:30px;border-radius:8px;border:2px solid var(--line);background:var(--paper);cursor:pointer;display:grid;place-items:center;font-weight:700}
.tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--paper)}
@media (max-width:640px){.day{grid-template-columns:1fr auto}.day .when{grid-column:1/-1;display:flex;gap:10px;align-items:baseline}.day .fields{grid-template-columns:1fr}}

/* diary */
.entry{padding:14px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.entry:first-child{border-top:0}
.entry .when{font:12px var(--f-mono);color:var(--muted)}
.entry .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.daygrp{font:400 15px var(--f-display);margin:18px 0 2px;color:var(--red)}

/* growth */
.chart svg{width:100%;height:auto;display:block}
.chart .grid line{stroke:var(--line)}
.chart text{fill:var(--muted);font:11px var(--f-mono)}
.chart .area{fill:var(--red);opacity:.12}
.chart .lnn{fill:none;stroke:var(--red);stroke-width:2.5}
.chart .dot{fill:var(--red);stroke:var(--card);stroke-width:2}
.mile{display:flex;flex-direction:column;gap:6px}
.bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.bar i.full{background:var(--ok)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* brand */
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.sw div{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.sw i{display:block;height:54px}
.sw p{margin:0;padding:8px 10px;font-size:12px}
.sw p b{display:block;font-size:13px}
.bigLogo{width:100%;max-width:300px;border-radius:8px;display:block}
.plain{background:transparent;border-color:transparent;padding:6px 0;min-height:60px}
.plain:hover{border-color:var(--line)}
.plain:focus{background:var(--paper);padding:9px 11px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,6,4,.55);z-index:20;display:flex;justify-content:center;align-items:flex-end}
@media (min-width:720px){.scrim{align-items:center;padding:24px}}
.sheet{background:var(--card);width:100%;max-width:720px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:720px){.sheet{border-radius:16px}}
.sheet .ttl{font:400 22px/1.2 var(--f-display);border:0;background:none;padding:0}
.sheet .ttl:focus{background:none;padding:0}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:520px){.f3{grid-template-columns:1fr 1fr}.f3>:last-child{grid-column:1/-1}}
.log{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--gold);margin-left:4px}
.log div{padding:6px 0 10px 14px;position:relative}
.log div::before{content:"";position:absolute;left:-6px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--gold)}
.log time{font:11px var(--f-mono);color:var(--muted);display:block}
.log p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.seg{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.seg button{border:0;background:none;padding:8px 12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.seg button[aria-selected="true"]{color:var(--ink);border-color:var(--red)}
.script{min-height:280px;font-size:15px}

/* checklist */
.pbar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ok)}
.cklist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ckrow{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:0;border-top:1px solid var(--line);cursor:pointer;text-align:left;font-weight:600}
.ckrow:first-child{border-top:0}
.ckrow[aria-pressed="true"]>span:nth-child(2){color:var(--muted);text-decoration:line-through;text-decoration-color:var(--ok)}
.ckrow[aria-pressed="true"] .tick{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.ckrow .tick{flex:none}

/* timeline */
.upcoming{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);gap:8px;overflow-x:auto;padding-bottom:6px}
.up{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:3px;min-width:0;text-align:left;cursor:pointer}
.up.empty-slot{border-style:dashed;background:none}
.up .dd{font:11px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.up .sr{font-size:12px;color:var(--red);font-weight:700}
.up .t{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tl{border-left:2px solid var(--line);margin-left:6px}
.ev{position:relative;padding:8px 0 12px 18px;display:flex;flex-direction:column;gap:2px}
.ev::before{content:"";position:absolute;left:-7px;top:13px;width:12px;height:12px;border-radius:50%;background:var(--c,var(--muted));border:2px solid var(--paper)}
.ev .k{font:11px var(--f-mono);color:var(--muted);letter-spacing:.04em}
.ev .x{overflow-wrap:anywhere;white-space:pre-wrap}
.ev button{all:unset;cursor:pointer;font-weight:700;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.ev button:focus-visible{outline:2px solid var(--red)}

/* idea timeline + scrap */
.st-Scrapped{background:none;color:var(--red);border:1px dashed var(--red)}
.card.scrapped{opacity:.72;border-style:dashed}
.card.scrapped h4{text-decoration:line-through;text-decoration-color:var(--red)}
.track{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;position:relative}
.track::before{content:"";position:absolute;left:8%;right:8%;top:9px;height:2px;background:var(--line)}
.stp{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;position:relative;min-width:0}
.stp i{width:20px;height:20px;border-radius:50%;background:var(--card);border:2px solid var(--line);z-index:1}
.stp.on i{background:var(--c);border-color:var(--c)}
.stp.cur i{box-shadow:0 0 0 4px var(--card),0 0 0 6px var(--c)}
.stp b{font-size:11px;font-weight:700;color:var(--muted);overflow:hidden;text-overflow:ellipsis;max-width:100%}
.stp.on b{color:var(--ink)}
.stp span{font-size:10px;color:var(--muted)}
.track.dead{opacity:.45;filter:grayscale(.6)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.facts div{background:var(--card);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.facts span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.facts b{font-size:15px}
.facts b.good{color:var(--ok)}.facts b.bad{color:var(--red)}
.scrapband{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border:1px dashed var(--red);border-radius:var(--r);color:var(--red)}
.scrapband p{margin:2px 0 0;color:var(--ink);font-size:14px}
.scrapbox{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--red);border-radius:var(--r);background:var(--paper)}
/* review */
.rstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.slips{display:flex;flex-wrap:wrap;gap:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.notice{background:var(--sunk);border-radius:8px;padding:10px 14px;font-size:14px;margin-bottom:14px}
/* motion: press, ripple, pop on state change, sheet slide, view fade */
.btn,.tab,.tick,.ckrow,.card,.li,.up,.chip[data-pcat],.chip[data-tlk],.chip[data-reason]{position:relative;overflow:hidden;transition:transform .12s ease,background-color .2s ease,color .2s ease,border-color .2s ease,box-shadow .2s ease;-webkit-tap-highlight-color:transparent}
.btn:active,.tab:active,.tick:active,.chip[data-pcat]:active,.chip[data-tlk]:active,.chip[data-reason]:active{transform:scale(.94)}
.card:active,.ckrow:active,.li:active,.up:active{transform:scale(.985)}
.btn.primary:hover{box-shadow:0 3px 0 rgba(0,0,0,.18);transform:translateY(-1px)}
.btn.primary:active{transform:translateY(1px) scale(.97);box-shadow:none}
.rip{position:absolute;border-radius:50%;pointer-events:none;background:currentColor;opacity:.22;transform:scale(0);animation:rip .55s ease-out forwards}
@keyframes rip{to{transform:scale(1);opacity:0}}
.pop{animation:pop .38s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{0%{transform:scale(.6)}55%{transform:scale(1.18)}100%{transform:scale(1)}}
.land{animation:land .6s ease-out}
@keyframes land{0%{transform:translateY(-8px);opacity:.3;box-shadow:0 0 0 2px var(--red)}60%{opacity:1}100%{transform:none;box-shadow:0 0 0 0 transparent}}
.vin{animation:vin .28s ease-out}
@keyframes vin{from{opacity:0;transform:translateY(8px)}}
.scrim.enter{animation:fade .2s ease-out}
.scrim.enter .sheet{animation:sheetUp .32s cubic-bezier(.2,.9,.3,1.05)}
.scrim.leave{animation:fade .18s ease-in reverse forwards}
.scrim.leave .sheet{animation:sheetUp .18s ease-in reverse forwards}

<script>
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const SERIES=['Masked Mondays','Tuesday Trap','Wednesdays at the Counter','Thursdays Teardown','Friday Confessionals','Saturday People','Sunday Roundup'];
const SERIES_ALL=[...SERIES,'Bare Numbers','Unassigned'];
const FORMATS=['Long-form','Short','Reel','Insta post','Story','Newsletter'];
const STAGES=['Idea','Scripting','Shooting','Editing','Scheduled','Published'];
const STAGE_C={Idea:'var(--muted)',Scripting:'var(--blue)',Shooting:'var(--gold)',Editing:'var(--red)',Scheduled:'var(--ink)',Published:'var(--ok)'};
const PCATS=['Image','SEO','Script','Carousel','Subtitles','Newsletter','Other'];
const VIEWS=[['home','Dashboard'],['ideas','Idea Vault'],['pipeline','Pipeline'],['schedule','Weekly'],['timeline','Timeline'],['review','Review'],['diary','Diary'],['scripts','Scripts'],['growth','Growth'],['brand','Brand Kit'],['prompts','Prompts']];
const CHECK=[['script','Script final'],['thumb','Thumbnail'],['title','Title & SEO'],['srt','Hinglish SRT'],['caption','Insta caption'],['comment','Pinned comment']];
const ck=i=>CHECK.filter(([k])=>i.checklist&&i.checklist[k]).length;
const ckChip=i=>{const n=ck(i);return `<span class="chip mono ${n===CHECK.length?'wc-ok':''}">✓ ${n}/${CHECK.length}</span>`};
function warnShip(i){const n=ck(i);if(n<CHECK.length)toast(`Published with ${n}/${CHECK.length} checklist items done`)}

const S={ideas:[],diary:[],prompts:[],growth:[],sched:{},reviews:{},brand:{},brandExists:false};
const loaded={};let db=null;let weekOff=0;let reviewOff=0;let tlKind='All';let tlLimit=120;let ideaFilter={q:'',stage:'All',series:'All'};let diaryQ='';let promptCat='All';

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>new Date().toISOString();
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function monday(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
const wkey=d=>'w-'+ymd(monday(d));
const dIdx=d=>(d.getDay()+6)%7;
const daysSince=iso=>iso?(Date.now()-new Date(iso))/864e5:999;
function ago(iso){if(!iso)return'';const s=(Date.now()-new Date(iso))/1000;if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';const d=Math.floor(s/86400);if(d<30)return d+'d ago';return new Date(iso).toLocaleDateString('en-IN',{day:'numeric',month:'short'})}
const fmtDT=iso=>new Date(iso).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
const words=t=>(t||'').trim().split(/\s+/).filter(Boolean).length;
const num=n=>Number(n||0).toLocaleString('en-IN');
function wcChip(i){const w=words(i.script);if(!w)return'';const tgt=i.format==='Short';const ok=w>=190&&w<=220;return `<span class="chip mono ${tgt?(ok?'wc-ok':'wc-off'):''}">${w} words${tgt?' · 190–220':''}</span>`}
const opts=(arr,sel)=>arr.map(v=>`<option${v===sel?' selected':''}>${esc(v)}</option>`).join('');

const reduced=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
let popSel=null;const popAfter=s=>{popSel=s};
function applyPop(){if(!popSel)return;const s=popSel;popSel=null;const el=document.querySelector(s);if(!el||reduced())return;
  const c=el.matches('.card,.entry,tr,.log div,.scrapband,.track,.ev')?'land':'pop';el.classList.remove(c);void el.offsetWidth;el.classList.add(c);el.addEventListener('animationend',()=>el.classList.remove(c),{once:true})}
document.addEventListener('pointerdown',e=>{if(reduced())return;const el=e.target.closest('.btn,.tab,.tick,.ckrow,.card,.li,.up,.chip[data-pcat],.chip[data-tlk],.chip[data-reason]');if(!el)return;
  const r=el.getBoundingClientRect(),s=Math.max(r.width,r.height)*2.2,sp=document.createElement('span');sp.className='rip';
  sp.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;el.appendChild(sp);sp.addEventListener('animationend',()=>sp.remove())},{passive:true});
let sheetEnter=false;const enterCls=()=>{const c=sheetEnter&&!reduced()?' enter':'';sheetEnter=false;return c};
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;t.classList.remove('in');void t.offsetWidth;t.classList.add('in');clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2400)}
function errMsg(e){if(e&&e.code==='quota_exceeded')return'Storage is full. Delete a few old entries, then try again.';if(e&&e.code==='invalid_argument')return'That change could not be saved. You may have view-only access.';return'Could not save just now. Check your connection and try again.'}

/* ---- writes: one at a time per document ---- */
const chains={},pend={},timers={};
function enqueue(path,op){chains[path]=(chains[path]||Promise.resolve()).then(op).catch(e=>toast(errMsg(e)));return chains[path]}
function patch(path,data,delay=600){pend[path]={...(pend[path]||{}),...data};clearTimeout(timers[path]);timers[path]=setTimeout(()=>flush(path),delay)}
function flush(path){clearTimeout(timers[path]);const d=pend[path];if(!d)return;delete pend[path];if(!db)return;
  if(path==='brand/kit'&&!S.brandExists){S.brandExists=true;const full={...S.brand,...d};return enqueue(path,()=>db.doc(path).set(full))}
  return enqueue(path,()=>db.doc(path).update(d))}
function flushAll(){Object.keys(pend).forEach(flush)}
async function addDoc(col,data){if(!db){toast('Saving is unavailable in this view.');return null}
  try{const r=await db.collection(col).add(data);return r.id}catch(e){toast(errMsg(e));return null}}
function delDoc(path){if(db)enqueue(path,()=>db.doc(path).delete())}
function setIdea(id,data,delay,events=[]){const i=S.ideas.find(x=>x.id===id);if(!i)return;const t=now();data.updated=t;const h=[...(i.history||[])];const n0=h.length;
  if(data.stage&&data.stage!==i.stage){h.push({t,type:'stage',stage:data.stage,from:i.stage});if(data.stage==='Published')warnShip(i)}
  if('script' in data&&words(data.script)>0&&!h.some(e=>e.type==='script'))h.push({t,type:'script'});
  if(data.checklist){CHECK.forEach(([k,l])=>{const was=!!(i.checklist&&i.checklist[k]),now_=!!data.checklist[k];if(was!==now_)h.push({t,type:'check',key:k,on:now_})});
    const full=CHECK.every(([k])=>data.checklist[k]);if(full&&ck(i)<CHECK.length)h.push({t,type:'ready'})}
  events.forEach(e=>h.push({t,...e}));
  if(h.length!==n0)data.history=h;Object.assign(i,data);patch('ideas/'+id,data,delay)}
const live=i=>!i.scrapped;
const HIST_TXT={script:'First draft of the script started',ready:'Checklist complete. Ready to ship',scrap:'Scrapped',restore:'Restored from scrap',created:'Idea created'};
function histLine(e){const ty=e.type||(e.stage?'stage':'');const lbl=k=>(CHECK.find(c=>c[0]===k)||[,k])[1];
  if(ty==='stage')return{c:STAGE_C[e.stage]||'var(--muted)',h:`Moved to <span class="chip st st-${esc(e.stage)}">${esc(e.stage)}</span>${e.from?` <span class="sub" style="font-size:12px">from ${esc(e.from)}</span>`:''}`};
  if(ty==='check')return{c:'var(--ok)',h:`${e.on?'Ticked':'Unticked'} <b>${esc(lbl(e.key))}</b>`};
  if(ty==='slot')return{c:'var(--ink)',h:`Booked for <b>${esc(e.day)}</b> · ${esc(e.series)}`};
  if(ty==='scrap')return{c:'var(--red)',h:'<b style="color:var(--red)">Scrapped</b>',x:e.reason};
  if(ty==='restore')return{c:'var(--blue)',h:'Restored from scrap'};
  if(ty==='script')return{c:'var(--blue)',h:'Script started'};
  if(ty==='ready')return{c:'var(--ok)',h:'<b>Checklist complete.</b> Ready to ship'};
  return{c:'var(--muted)',h:esc(ty)}}

/* ---- render with draft preservation ---- */
let raf=0;function rerender(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;render()})}
function route(){const h=location.hash.slice(1);return VIEWS.some(v=>v[0]===h)?h:'home'}
function render(){
  const v=route();
  document.getElementById('tabs').innerHTML=VIEWS.map(([k,l])=>`<button class="tab" data-go="${k}"${k===v?' aria-current="page"':''}>${l}</button>`).join('');
  const root=document.getElementById('view');
  const a=document.activeElement;const keep={};root.querySelectorAll('[id]').forEach(el=>{if('value' in el&&el.type!=='button')keep[el.id]=el.value});
  const fid=a&&root.contains(a)?a.id:null;const sel=fid&&a.selectionStart!=null?[a.selectionStart,a.selectionEnd]:null;
  root.innerHTML=(V[v]||V.home)();
  for(const k in keep){const el=document.getElementById(k);if(el&&el.dataset.keep!=null&&el.value!==keep[k])el.value=keep[k]}
  if(fid){const el=document.getElementById(fid);if(el){el.focus();if(sel)try{el.setSelectionRange(...sel)}catch(e){}}}
  applyPop();
}

function doneOn(d){return !!S.sched[wkey(d)]?.days?.[dIdx(d)]?.done}
function streak(){const d=new Date();if(!doneOn(d))d.setDate(d.getDate()-1);let n=0;while(n<500&&doneOn(d)){n++;d.setDate(d.getDate()-1)}return n}

function chart(g){const pts=g.filter(r=>r.subs!=null&&r.subs!=='');if(pts.length<2)return `<div class="empty">Log at least two dates to see the line.</div>`;
  const W=640,H=230,m={l:48,r:20,t:14,b:28};const xs=pts.map(p=>new Date(p.date).getTime()),x0=Math.min(...xs),x1=Math.max(...xs)||x0+1;
  const ymax=Math.max(...pts.map(p=>+p.subs));const step=Math.pow(10,Math.floor(Math.log10(ymax||1)));const top=Math.ceil((ymax||1)/step)*step||1;
  const X=t=>m.l+(t-x0)/((x1-x0)||1)*(W-m.l-m.r),Y=v=>H-m.b-(v/top)*(H-m.t-m.b);
  const line=pts.map((p,i)=>`${i?'L':'M'}${X(xs[i]).toFixed(1)},${Y(+p.subs).toFixed(1)}`).join('');
  const area=line+`L${X(xs[xs.length-1]).toFixed(1)},${Y(0)}L${X(xs[0]).toFixed(1)},${Y(0)}Z`;
  const ticks=[0,.25,.5,.75,1].map(f=>Math.round(top*f));const lp=pts[pts.length-1];const fd=s=>new Date(s).toLocaleDateString('en-IN',{day:'numeric',month:'short'});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Subscribers line chart"><g class="grid">${ticks.map(t=>`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(t)}" y2="${Y(t)}"/>`).join('')}</g>
  ${ticks.map(t=>`<text x="${m.l-8}" y="${Y(t)+4}" text-anchor="end">${num(t)}</text>`).join('')}
  <text x="${m.l}" y="${H-8}">${fd(pts[0].date)}</text><text x="${W-m.r}" y="${H-8}" text-anchor="end">${fd(lp.date)}</text>
  <path class="area" d="${area}"/><path class="lnn" d="${line}"/><circle class="dot" r="5" cx="${X(xs[xs.length-1])}" cy="${Y(+lp.subs)}"/></svg>`}

function weekRange(off){const b=new Date();b.setDate(b.getDate()+off*7);const mon=monday(b);const end=new Date(mon);end.setDate(mon.getDate()+7);return{k:wkey(b),mon,end}}

function weekStats(r){const days=S.sched[r.k]?.days||{};const today=new Date();
  const slipped=SERIES.map((s,i)=>{const d=new Date(r.mon);d.setDate(r.mon.getDate()+i);return{s,i,d,past:ymd(d)<ymd(today),done:!!days[i]?.done}}).filter(x=>x.past&&!x.done);
  const published=S.ideas.filter(i=>(i.history||[]).some(h=>h.stage==='Published'&&inR(h.t,r)));

  const diary=S.diary.filter(e=>inR(e.created,r)).length;
  return{shipped:Object.values(days).filter(x=>x&&x.done).length,slipped,published,created,notes,diary}}

  if(d.act==='scrap'){const why=document.getElementById('scrap-why').value.trim();const i=S.ideas.find(x=>x.id===openId);scrapMode=false;sheetTab='timeline';
    setIdea(i.id,{scrapped:{t:now(),reason:why}},0,[{type:'scrap',reason:why}]);popAfter('.scrapband');drawIdea();rerender();toast('Scrapped. Find it under Vault → Scrapped');return}
  if(d.act==='restore'){const i=S.ideas.find(x=>x.id===openId);setIdea(i.id,{scrapped:null},0,[{type:'restore'}]);popAfter('.track');drawIdea();rerender();toast('Restored to '+i.stage);return}
  if(d.ck){const i=S.ideas.find(x=>x.id===openId);const c={...(i.checklist||{})};c[d.ck]=!c[d.ck];setIdea(i.id,{checklist:c},0);popAfter(`[data-ck="${d.ck}"] .tick`);drawIdea();rerender();return}
  if(d.rwk!=null){flushAll();reviewOff=d.rwk==='0'?0:reviewOff+(+d.rwk);return rerender()}
  if(d.tlk){popAfter(`[data-tlk="${d.tlk}"]`);tlKind=d.tlk;tlLimit=120;return rerender()}
  if(d.act==='tlmore'){tlLimit+=120;return rerender()}
  if(d.act==='export')return exportAll();
  if(d.act==='review2diary')return reviewToDiary(d.wkey);
  if(d.wk!=null){weekOff=d.wk==='0'?0:weekOff+(+d.wk);return rerender()}
  if(d.pcat){popAfter(`[data-pcat="${d.pcat}"]`);promptCat=d.pcat;return rerender()}
  if(d.todayDone!=null){const t=new Date();d.done=String(dIdx(t));d.wkey=wkey(t)}
  if(d.done!=null){const k=d.wkey,i=+d.done,sl=S.sched[k]?.days?.[i]||{};const nv=!sl.done;setSlot(k,i,{done:nv});popAfter(d.todayDone!=null?'[data-today-done]':`[data-done="${i}"][data-wkey="${k}"]`);
    if(nv&&sl.ideaId){const idea=S.ideas.find(x=>x.id===sl.ideaId);if(idea&&idea.stage!=='Published'){toast(`“${idea.title}” moved to Published`);setIdea(idea.id,{stage:'Published'},0)}}return rerender()}
  if(d.deldiary){if(pendingDel===d.deldiary){S.diary=S.diary.filter(x=>x.id!==d.deldiary);delDoc('diary/'+d.deldiary);pendingDel=null}else pendingDel=d.deldiary;return rerender()}
  if(d.delgrowth){if(pendingDel===d.delgrowth){S.growth=S.growth.filter(x=>x.id!==d.delgrowth);delDoc('growth/'+d.delgrowth);pendingDel=null}else pendingDel=d.delgrowth;return rerender()}
  const a=d.act;
  if(a==='close')return closeSheet();
  if(a==='newidea'){const id=await newIdea('','Unassigned');if(id){openIdea(id,'notes');setTimeout(()=>{const t=document.getElementById('e-title');t&&(t.select(),t.focus())},30)}return}
  if(a==='capture'){const inp=document.getElementById('qc');const v=inp.value.trim();if(!v){inp.focus();return}const id=await newIdea(v,SERIES[dIdx(new Date())]);if(id){inp.value='';toast('Saved to the vault');rerender()}return}
  if(a==='addlog'){const ta=document.getElementById('e-log');const v=ta.value.trim();if(!v)return ta.focus();const i=S.ideas.find(x=>x.id===openId);const log=[...(i.log||[]),{t:now(),text:v}];setIdea(i.id,{log},0);popAfter('.log div');drawIdea();return}
  if(a==='delidea'){if(!confirmDel){confirmDel=true;return drawIdea()}const id=openId;delete pend['ideas/'+id];S.ideas=S.ideas.filter(x=>x.id!==id);delDoc('ideas/'+id);closeSheet();toast('Idea deleted');return}
  if(a==='diary'){const ta=document.getElementById('d-text'),v=ta.value.trim();if(!v)return ta.focus();const ideaId=document.getElementById('d-idea').value;const doc={text:v,ideaId,created:now()};const id=await addDoc('diary',doc);if(id){S.diary.push({id,...doc});ta.value='';document.getElementById('d-idea').value='';popAfter('#view .entry');toast('Entry added');rerender()}return}
  if(a==='growth'){const g=k=>{const v=document.getElementById('g-'+k).value;return v===''?null:Number(v)};const doc={date:document.getElementById('g-date').value||ymd(new Date()),subs:g('subs'),views:g('views'),hours:g('hours'),ig:g('ig')};
    if([doc.subs,doc.views,doc.hours,doc.ig].every(v=>v==null)){toast('Enter at least one number.');return}
    const id=await addDoc('growth',doc);if(id){S.growth.push({id,...doc});['subs','views','hours','ig'].forEach(k=>document.getElementById('g-'+k).value='');popAfter('tbody tr');toast('Logged');rerender()}return}
  if(a==='newprompt'){const doc={title:'',cat:promptCat==='All'?'Other':promptCat,body:'',created:now()};const id=await addDoc('prompts',doc);if(id){S.prompts.push({id,...doc});openPrompt(id)}return}
  if(a==='delprompt'){if(!confirmDel){confirmDel=true;return drawPrompt()}const id=openId;delete pend['prompts/'+id];S.prompts=S.prompts.filter(x=>x.id!==id);delDoc('prompts/'+id);closeSheet();return}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&openId)return closeSheet();
  if(e.key==='Enter'&&e.target.id==='qc'){e.preventDefault();document.querySelector('[data-act="capture"]').click()}
  if(e.key==='Enter'&&e.target.matches('.card[role=button]')&&e.target===document.activeElement){e.target.click()}
});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;
  if(t.id==='e-title'){setIdea(openId,{title:t.value})}
  else if(d.ifield&&t.tagName!=='SELECT'){setIdea(openId,{[d.ifield]:t.value});if(d.ifield==='script'){const i=S.ideas.find(x=>x.id===openId);document.getElementById('wc').innerHTML=wcChip(i)||'<span class="chip mono">0 words</span>'}}
  else if(d.pfield&&t.tagName!=='SELECT'){const p=S.prompts.find(x=>x.id===openId);p[d.pfield]=t.value;patch('prompts/'+openId,{[d.pfield]:t.value})}
  else if(d.brand){S.brand[d.brand]=t.value;patch('brand/kit',{[d.brand]:t.value},800)}
  else if(d.slotnote!=null){setSlot(d.wkey,+d.slotnote,{note:t.value},700)}
  else if(d.rv&&t.tagName!=='SELECT'){setReview(d.wkey,{[d.rv]:t.value})}
  else if(t.id==='q-ideas'){ideaFilter.q=t.value;rerender()}
  else if(t.id==='q-diary'){diaryQ=t.value;rerender()}
});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
  if(d.ifield&&t.tagName==='SELECT'){setIdea(openId,{[d.ifield]:t.value},0);drawIdea()}
  else if(d.pfield==='cat'){const p=S.prompts.find(x=>x.id===openId);p.cat=t.value;patch('prompts/'+openId,{cat:t.value},0);drawPrompt()}
  else if(d.slot!=null){setSlot(d.wkey,+d.slot,{ideaId:t.value});
    if(t.value){const dt=new Date(d.wkey.slice(2)+'T00:00:00');dt.setDate(dt.getDate()+(+d.slot));setIdea(t.value,{},0,[{type:'slot',day:`${DAYS[+d.slot]} ${fd(dt.toISOString())}`,series:SERIES[+d.slot]}])}rerender()}
  else if(d.rv&&t.tagName==='SELECT'){setReview(d.wkey,{[d.rv]:t.value},0)}
  else if(t.id==='f-stage'){ideaFilter.stage=t.value;rerender()}
  else if(t.id==='f-series'){ideaFilter.series=t.value;rerender()}
});
window.addEventListener('hashchange',()=>{pendingDel=null;popAfter('.tab[aria-current]');render();window.scrollTo(0,0);const v=document.getElementById('view');if(!reduced()){v.classList.remove('vin');void v.offsetWidth;v.classList.add('vin')}});
window.addEventListener('pagehide',flushAll);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flushAll()});

/* ---- data ---- */
function note(m){document.getElementById('note').innerHTML=m?`<div class="notice">${m}</div>`:''}
function subscribe(col,key){const t=setTimeout(()=>{if(!loaded[key])note('Your data hasn’t loaded yet. Check your connection; this page keeps trying.')},10000);
  db.collection(col).onSnapshot(s=>{if(!s.metadata.fromCache){clearTimeout(t);loaded[key]=true;if(Object.keys(loaded).length>=6)note('')}
    const rows=s.docs.map(d=>({id:d.id,...d.data()}));
    if(key==='sched'){const m={};rows.forEach(r=>m[r.id]=r);S.sched=m}
    else if(key==='reviews'){const m={};rows.forEach(r=>m[r.id]={...r,...(pendR[r.id]||{})});Object.keys(pendR).forEach(k=>{if(!m[k])m[k]={week:k.slice(2),...pendR[k]}});S.reviews=m}
    else S[key]=rows;
    rerender();if(openKind==='idea'&&!S.ideas.find(x=>x.id===openId))closeSheet()},
  ()=>{clearTimeout(t);loaded[key]=true;note('Some data could not be loaded. Reload the page to try again.');rerender()})}
render();
(async()=>{db=window.claude?await window.claude.use('db'):null;
  if(!db){['ideas','diary','prompts','growth','sched','reviews'].forEach(k=>loaded[k]=true);note('Saving isn’t available in this view, so changes won’t be kept. Open the artifact while signed in to Claude.');return rerender()}
  subscribe('ideas','ideas');subscribe('diary','diary');subscribe('prompts','prompts');subscribe('growth','growth');subscribe('schedule','sched');subscribe('reviews','reviews');
  db.doc('brand/kit').onSnapshot(s=>{S.brandExists=s.exists;const fresh=s.exists?{...s.data()}:{};const p=pend['brand/kit']||{};S.brand={...fresh,...p};if(route()==='brand'){const a=document.activeElement;if(!(a&&a.dataset&&a.dataset.brand))rerender()}else rerender()},()=>{});
})();
</script>

</body></html>
