<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#070b14"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Ascend"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><script src="pwa.js" data-app="ascend" data-caps="downloads"></script><style>.pwa-home{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;text-decoration:none;font:600 18px/1 system-ui,sans-serif;border:1px solid currentColor;opacity:.75;-webkit-tap-highlight-color:transparent}.pwa-home:active{transform:scale(.92)}</style><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ascend System</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: one-column HUD of "system windows", sticky status header, fixed bottom tab bar. Single dark game look by design. */
:root{
  --bg:#070b14; --panel:#0d1424; --panel2:#121b31; --line:#203050; --line2:#2c4270;
  --fg:#e4ecfa; --muted:#8597bb; --dim:#5a6a8c;
  --accent:#4fb3ff; --glow:rgba(79,179,255,.28);
  --gold:#f2c14e; --hm:143,168,216; --danger:#ff4d6d; --danger-bg:rgba(255,77,109,.1); --ok:#3ddc97;
  --int:#4fb3ff; --elo:#b48cff; --foc:#33d6c5; --dis:#f2c14e; --vit:#ff7a59;
  --display:'Chakra Petch','Rajdhani',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  background:radial-gradient(120% 60% at 50% -10%,rgba(79,179,255,.10),transparent 60%),var(--bg);min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(7,11,20,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.22em;font-size:15px;color:var(--accent);text-shadow:0 0 12px var(--glow)}
.top .sp{flex:1}
.chip{font-family:var(--mono);font-size:12px;border:1px solid var(--line2);border-radius:4px;padding:2px 8px;color:var(--muted);white-space:nowrap}
.chip b{color:var(--fg);font-weight:600}
.sync{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.sync.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.sync.warn{background:var(--gold)}

main{position:relative;z-index:1;max-width:640px;margin:0 auto;padding-block:16px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}

.win{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:6px;position:relative;min-width:0}
.win.glow{border-color:var(--line2);box-shadow:0 0 0 1px rgba(79,179,255,.08),0 0 28px -6px var(--glow)}
.win-h{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.win-h .r{margin-left:auto;font-family:var(--mono);letter-spacing:0;text-transform:none;color:var(--muted);font-weight:500}
.win-b{padding:14px;display:flex;flex-direction:column;gap:12px}
.corner::before,.corner::after{content:"";position:absolute;width:10px;height:10px;border-color:var(--accent);border-style:solid;opacity:.7}
.corner::before{top:-1px;left:-1px;border-width:2px 0 0 2px;border-top-left-radius:6px}
.corner::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0;border-bottom-right-radius:6px}

.who{display:flex;align-items:center;gap:14px}
.rank{width:52px;height:52px;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:28px;border:2px solid currentColor;border-radius:6px;transform:rotate(45deg)}
.rank span{transform:rotate(-45deg)}
.rank-E{color:#8a96ad}.rank-D{color:var(--vit)}.rank-C{color:var(--foc)}.rank-B{color:var(--int)}.rank-A{color:var(--elo)}.rank-S{color:var(--gold);text-shadow:0 0 12px rgba(242,193,78,.5)}
.pname{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.1}
.ptitle{color:var(--muted);font-size:13px}
.lv{margin-left:auto;text-align:right;font-family:var(--display)}
.lv span{display:block;font-size:11px;letter-spacing:.2em;color:var(--muted)}
.lv b{font-size:34px;line-height:1;color:var(--fg)}

.bar{height:8px;background:#0a1020;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);box-shadow:0 0 10px var(--glow);transition:width .4s}
.bar.xp i{background:linear-gradient(90deg,var(--accent),#8fd0ff)}
.bar.hp{height:12px}.bar.hp i{background:linear-gradient(90deg,#c2203f,var(--danger))}
.row{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.row b{color:var(--fg);font-weight:600}

.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{border:1px solid var(--line);border-radius:4px;padding:8px 10px;background:rgba(7,11,20,.4)}
.cell .k{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-family:var(--display)}
.cell .v{font-family:var(--mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}

.stat{display:grid;grid-template-columns:92px 1fr 54px;align-items:center;gap:10px}
.stat .n{font-family:var(--display);font-weight:600;font-size:14px}
.stat .n small{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);font-weight:500;letter-spacing:.08em}
.stat .val{font-family:var(--mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted)}
.note b{color:var(--fg);font-weight:600}

.penalty{border:1px solid var(--danger);background:var(--danger-bg);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:8px}
.penalty .h{font-family:var(--display);font-weight:700;letter-spacing:.16em;color:var(--danger);font-size:13px}
.penalty p{margin:0}

.quest{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line)}
.quest:first-child{border-top:0}
.check{flex:none;width:26px;height:26px;border:1.5px solid var(--line2);border-radius:4px;background:transparent;display:grid;place-items:center;margin-top:1px;padding:0}
.quest.done .check{background:var(--accent);border-color:var(--accent);box-shadow:0 0 10px var(--glow)}
.check svg{width:16px;height:16px;opacity:0}
.quest.done .check svg{opacity:1}
.qb{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.qn{font-weight:500}
.quest.done .qn{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--dim)}
.qm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--muted)}
.tag{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.06em;padding:1px 6px;border-radius:3px;border:1px solid currentColor}
.t-INT{color:var(--int)}.t-ELO{color:var(--elo)}.t-FOC{color:var(--foc)}.t-DIS{color:var(--dis)}.t-VIT{color:var(--vit)}
.hint{font-size:12.5px;color:var(--muted)}
.panel{margin-top:6px;display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line2);border-radius:4px;background:rgba(7,11,20,.5)}
.panel label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;background:#0a1020;border:1px solid var(--line2);border-radius:4px;padding:9px 10px;font-size:15px;min-width:0}
textarea{min-height:68px;resize:vertical}
.err{color:var(--danger);font-size:12.5px}

.btn{border:1px solid var(--accent);background:rgba(79,179,255,.1);color:var(--accent);padding:9px 14px;border-radius:4px;font-family:var(--display);font-weight:600;letter-spacing:.08em;font-size:13px;text-transform:uppercase}
.btn:hover{background:rgba(79,179,255,.18)}
.btn.ghost{border-color:var(--line2);color:var(--muted);background:transparent}
.btn.red{border-color:var(--danger);color:var(--danger);background:var(--danger-bg)}
.btn.sm{padding:5px 10px;font-size:11px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line2);background:transparent;border-radius:4px;padding:6px 10px;font-family:var(--mono);font-size:13px;color:var(--muted)}
.chips button.on{border-color:var(--accent);color:var(--accent);background:rgba(79,179,255,.1)}

.raid-name{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.15}
.badge{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.14em;padding:2px 8px;border-radius:3px}
.b-active{color:var(--danger);border:1px solid var(--danger)}
.b-clear{color:var(--ok);border:1px solid var(--ok)}
.b-fail{color:var(--dim);border:1px solid var(--dim)}
.stage{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.stage .check{width:22px;height:22px}
.stage.done .check{background:var(--accent);border-color:var(--accent)}
.stage.done .check svg{opacity:1}
.stage.done span{color:var(--muted);text-decoration:line-through}

.bars{display:flex;align-items:flex-end;gap:6px;height:110px;padding-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.bars i{display:block;width:100%;max-width:34px;background:var(--accent);border-radius:2px 2px 0 0;min-height:2px;box-shadow:0 0 8px var(--glow)}
.bars i.zero{background:var(--line);box-shadow:none}
.bars small{font-family:var(--mono);font-size:10px;color:var(--muted)}
.bars em{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--fg)}

.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .d{font-family:var(--mono);font-size:11px;color:var(--muted);flex:none;width:52px}
.li .t{flex:1;min-width:0;overflow-wrap:anywhere}
.x{background:none;border:0;color:var(--dim);font-size:18px;line-height:1;padding:0 4px}

.word{font-family:var(--display);font-weight:700;font-size:24px;color:var(--fg)}
.word small{font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted);margin-left:6px}
.quote{border-left:2px solid var(--line2);padding-left:10px;color:var(--muted);font-size:13.5px;font-style:italic}

.log .li .t{font-family:var(--mono);font-size:12px;color:var(--muted)}
.title-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.title-row:first-child{border-top:0}
.title-row.locked{opacity:.45}
.title-row b{font-family:var(--display);font-size:15px}
.title-row .note{font-size:12px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(9,14,26,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{background:none;border:0;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--dim);font-family:var(--display);font-weight:600;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;min-width:0}
nav.tabs button svg{width:20px;height:20px}
nav.tabs button.on{color:var(--accent)}
nav.tabs button.on svg{filter:drop-shadow(0 0 6px var(--glow))}

.overlay{position:fixed;inset:0;z-index:40;background:rgba(3,6,12,.82);display:grid;place-items:center;padding:24px max(20px,env(safe-area-inset-left,0px))}
.sysbox{max-width:420px;width:100%;text-align:center}
.sysbox .win-b{padding:22px 18px;gap:14px;align-items:center}
.sysbox h2{margin:0;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.06em;text-wrap:balance}
.sysbox p{margin:0;color:var(--muted)}
.sysbox .warn{color:var(--danger);font-size:13px}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--panel2);border:1px solid var(--accent);color:var(--fg);padding:10px 16px;border-radius:4px;font-family:var(--display);font-weight:600;letter-spacing:.06em;box-shadow:0 0 24px -4px var(--glow);max-width:calc(100% - 32px);text-align:center}
#toast.bad{border-color:var(--danger);box-shadow:0 0 24px -4px rgba(255,77,109,.4)}
.sec-t{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:4px 2px -6px}
details summary{cursor:pointer;color:var(--accent);font-family:var(--display);font-weight:600;letter-spacing:.08em;font-size:13px;text-transform:uppercase}
.th{padding:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;min-width:0}
.th:first-child{border-top:0}
.th-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--muted)}
.th-t{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}
.st{font-family:var(--display);font-weight:700;font-size:10px;letter-spacing:.14em;padding:1px 7px;border-radius:3px;border:1px solid currentColor}
.st-seed{color:var(--accent)}.st-sapling{color:var(--ok)}.st-fruit{color:var(--gold)}
.tagl{display:flex;gap:6px;flex-wrap:wrap}
.tagl button{background:none;border:0;padding:0;font-family:var(--mono);font-size:12px;color:var(--accent)}
.th-a{display:flex;gap:6px;flex-wrap:wrap}
.fruitnote{font-family:var(--mono);font-size:12px;color:var(--gold)}
.linkline{font-size:12.5px;color:var(--elo)}
.frag{border:1px dashed var(--line2)}
.ov-full{position:fixed;inset:0;z-index:45;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ov-bar{display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.ov-bar .t{font-family:var(--display);font-weight:700;letter-spacing:.16em;color:var(--accent);text-transform:uppercase;font-size:14px;flex:1;min-width:0}
.ov-body{flex:1;min-height:0;overflow:auto;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ov-body>div{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
#treeCv{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.tree-wrap{flex:1;min-height:0;position:relative}
.tree-info{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:12px;max-width:560px;margin:0 auto;background:rgba(13,20,36,.96);border:1px solid var(--line2);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:6px;max-height:45%;overflow:auto}
.tree-stats{display:flex;gap:8px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-top:1px solid var(--line);align-items:center}
.opt{display:block;width:100%;text-align:left;background:#0a1020;border:1px solid var(--line2);border-radius:4px;padding:12px;font-size:14.5px;line-height:1.45}
.opt.right{border-color:var(--ok);background:rgba(61,220,151,.1)}
.opt.wrong{border-color:var(--danger);background:var(--danger-bg)}
.opt:disabled{cursor:default;opacity:1}
.qtext{font-size:16px;line-height:1.55;white-space:pre-wrap}
.stage .grow{flex:1;min-width:0}
.chat{display:flex;flex-direction:column;gap:10px}
.bub{padding:10px 12px;border-radius:6px;max-width:90%;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.bub small{display:block;font-family:var(--display);font-weight:600;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.bub.me{align-self:flex-end;background:rgba(79,179,255,.1);border:1px solid var(--line2)}
.bub.ai{align-self:flex-start;background:rgba(180,140,255,.08);border:1px solid rgba(180,140,255,.3)}
.djgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dj{text-align:left;background:rgba(7,11,20,.5);border:1px solid var(--line2);border-radius:5px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.dj b{font-family:var(--display);font-weight:600;font-size:14px;color:var(--fg)}
.dj span{font-size:12px;color:var(--muted)}
.dj:hover{border-color:var(--accent)}
.dj:last-child:nth-child(odd){grid-column:1/-1}
#bgfx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.ring{position:relative;width:34px;height:34px;flex:none}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--fg)}
.ring.full span{color:var(--accent)}
.sigil{flex:none;display:block}
.sg-spin{transform-origin:50px 50px;animation:spin 24s linear infinite}
.sg-spin.rev{animation-direction:reverse;animation-duration:40s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes winIn{from{opacity:.3;transform:translateY(8px);filter:brightness(1.6);box-shadow:0 -2px 0 var(--accent)}to{opacity:1;transform:none;filter:none}}
main.anim>.win,main.anim>.penalty,main.anim>.frag{animation:winIn .5s cubic-bezier(.2,.8,.2,1) both}
main.anim>*:nth-child(2){animation-delay:.05s}main.anim>*:nth-child(3){animation-delay:.1s}main.anim>*:nth-child(4){animation-delay:.15s}main.anim>*:nth-child(n+5){animation-delay:.2s}
@keyframes pop{0%{transform:scale(.6)}55%{transform:scale(1.22);box-shadow:0 0 0 6px var(--glow)}100%{transform:scale(1)}}
.check.pop{animation:pop .4s ease-out}
.xpf{position:fixed;z-index:65;pointer-events:none;transform:translateX(-50%);font-family:var(--mono);font-weight:700;font-size:15px;text-shadow:0 0 10px currentColor;animation:xpf 1.15s ease-out forwards}
@keyframes xpf{0%{opacity:0;transform:translate(-50%,6px)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-60px)}}
#lvlOv{position:fixed;inset:0;z-index:70;display:grid;place-items:center;overflow:hidden;text-align:center;cursor:pointer;
 background:radial-gradient(circle at 50% 45%,rgba(var(--lvrgb),.3),rgba(3,5,10,0) 62%),rgba(3,5,10,.93);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:24px max(24px,env(safe-area-inset-left,0px))}

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dkey=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return dkey(d)};
const weekKey=k=>{const d=parseKey(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return dkey(d)};
const diff=(a,b)=>Math.round((parseKey(b)-parseKey(a))/864e5);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmt=k=>{const d=parseKey(k);return d.getDate()+' '+MON[d.getMonth()]};
const dayIdx=k=>Math.floor(parseKey(k).getTime()/864e5);
const uid=()=>Math.random().toString(36).slice(2,9);
const TICK='<svg viewBox="0 0 24 24" fill="none" stroke="#06101f" stroke-width="3"><path d="M5 12l5 5 9-10"/></svg>';

/* ---------- content ---------- */
const STATS={INT:'Intellect',ELO:'Eloquence',FOC:'Focus',DIS:'Discipline',VIT:'Vitality'};
const DAILY=[
 {id:'read',name:'Read 20 pages of non-fiction',stat:'INT',xp:20},
 {id:'words',name:'Learn 3 new words, use one in a real conversation',stat:'ELO',xp:15,input:'words'},
 {id:'speak',name:'Speak drill: explain one idea out loud for 2 minutes',stat:'ELO',xp:25,input:'speak',hint:'Record a voice memo, replay it, and count your fillers (umm, like, basically, actually).'},
 {id:'focus',name:'Deep-focus block, 45–90 min, phone in another room',stat:'FOC',xp:25},
 {id:'body',name:'Workout or a 30-minute brisk walk',stat:'VIT',xp:20},
 {id:'model',name:"Use today's mental model on one real decision",stat:'INT',xp:10,input:'model'},
 {id:'journal',name:'Evening journal',stat:'DIS',xp:15,input:'journal'}
];
const WEEKLY=[
 {id:'essay',name:'Write 500 words on something you read',stat:'ELO',xp:80,hint:'A LinkedIn post, a note or a blog draft all count. Make one clear argument.'},
 {id:'impromptu',name:'3-minute impromptu talk, zero prep',stat:'ELO',xp:80,input:'impromptu'},
 {id:'teach',name:'Teach someone a concept in under 5 minutes',stat:'ELO',xp:60,hint:'Your spouse, a colleague, a customer. If they can explain it back, it counts.'},
 {id:'longform',name:'One lecture, debate or long podcast, with notes',stat:'INT',xp:60},
 {id:'review',name:'Weekly review',stat:'DIS',xp:50,input:'review'}
];
const AUTO_D={id:'thought',name:'Log one random thought in Mind',stat:'INT',xp:10,auto:true,hint:'Completes on its own when you save a thought.'};
const AUTO_W={id:'fruit',name:'Turn one thought into a fruit',stat:'ELO',xp:60,auto:true,hint:'Completes when you mark a thought as a fruit: it became an essay, a reel, a talk or a real decision.'};
const PENALTIES=[
 'Read 30 extra pages today, on top of your dailies.',
 'Cold shower, then write 300 words on why you missed.',
 '50 push-ups plus one extra 2-minute speak drill.',
 'An extra 60-minute study block with your phone in another room.',
 'No social media today until every daily quest is done.',
 'Walk 8,000 steps and read 15 extra pages.'
];
const RANKS=['E','D','C','B','A','S'];
const RANK_LV=[1,10,20,35,50,75];
const RANK_STAT=[0,150,500,1200,2500,5000];
const WORDS=[
 ['Perspicacious','having sharp judgement and insight','Her perspicacious read of the balance sheet caught the hidden leverage.'],
 ['Laconic','using very few words','His laconic reply ended the debate.'],
 ['Sagacious','wise, with good practical judgement','A sagacious lender looks at cash flow before collateral.'],
 ['Equanimity','calmness under pressure','He handled the audit with complete equanimity.'],
 ['Cogent','clear, logical and convincing','She made a cogent case for cutting the exposure.'],
 ['Erudite','having deep knowledge from study','An erudite speaker never needs to show off.'],
 ['Obfuscate','to make something unclear on purpose','Jargon is often used to obfuscate a weak argument.'],
 ['Juxtapose','to place side by side for contrast','Juxtapose last year’s NPA numbers with this year’s.'],
 ['Ameliorate','to make a bad situation better','The restructuring helped ameliorate the borrower’s stress.'],
 ['Candor','honesty and directness','I appreciate your candor about the delay.'],
 ['Circumspect','careful to consider risks','Be circumspect before signing any guarantee.'],
 ['Magnanimous','generous, especially toward a rival','He was magnanimous in victory.'],
 ['Pernicious','harmful in a gradual, subtle way','Small daily distractions have a pernicious effect on focus.'],
 ['Salient','most noticeable or important','Let me cover only the salient points.'],

 ['Quixotic','idealistic but unrealistic','Beating the market every year is a quixotic goal.'],
 ['Recalcitrant','stubbornly uncooperative','The recalcitrant borrower ignored every notice.'],

 ['Untenable','impossible to defend','That valuation is untenable at current rates.'],
 ['Zeitgeist','the mood or spirit of a particular time','AI anxiety is part of the current zeitgeist.'],
 ['Acumen','skill in making good judgements quickly','Business acumen is learned, not inherited.'],
 ['Alacrity','eager and quick readiness','She accepted the challenge with alacrity.'],
 ['Egregious','outstandingly bad','That was an egregious breach of policy.'],
 ['Fastidious','very attentive to detail','A fastidious analyst checks every footnote.'],
 ['Hubris','excessive pride or self-confidence','Hubris has sunk more funds than bad luck.'],
 ['Idiosyncratic','peculiar to an individual','Idiosyncratic risk can be diversified away.'],
 ['Lucid','expressed clearly; easy to understand','Give me one lucid sentence, not ten vague ones.'],

 ['Nuance','a subtle difference in meaning','The nuance matters more than the headline.'],

 ['Pragmatic','dealing with things sensibly and realistically','Take a pragmatic view of the recovery.'],
 ['Ubiquitous','present everywhere','UPI is now ubiquitous in India.'],
 ['Ephemeral','lasting a very short time','Market euphoria is usually ephemeral.'],
 ['Prudent','acting with care for the future','A prudent saver builds a buffer first.'],
 ['Tenacious','persistent, not giving up easily','Tenacious follow-up recovers bad loans.'],
 ['Verisimilitude','the appearance of being true','The forecast had verisimilitude but no data.'],
 ['Disparate','fundamentally different','Merge these disparate datasets carefully.'],
 ['Exacerbate','to make a problem worse','Panic selling will exacerbate the drop.'],
 ['Inimical','harmful or hostile to','Short-termism is inimical to compounding.']
];
const MODELS=[
 ['First principles','Break a problem down to what is definitely true, then rebuild from there.','Pick one assumption you hold about your work and test if it is actually true.'],
 ['Second-order thinking','Ask "and then what?" Consequences have consequences.','Before one decision today, write its second consequence.'],
 ['Inversion','Ask how you would guarantee failure, then avoid that.','List 3 ways you could fail this week. Remove one today.'],
 ['Circle of competence','Know exactly where your knowledge ends.','Name one topic you talk about but don’t truly understand.'],
 ['Occam’s razor','The simplest explanation is usually the right one.','When something goes wrong today, pick the simplest cause first.'],
 ['Hanlon’s razor','Don’t assume malice where a mistake explains it.','Reframe one irritating person’s action as an honest error.'],
 ['Opportunity cost','Every yes is a no to something else.','Name what your phone time cost you yesterday.'],
 ['Margin of safety','Leave a buffer for being wrong.','Add a 20% time buffer to one plan today.'],
 ['Pareto principle','About 80% of results come from 20% of efforts.','Find the 20% of your study topics that carry most of the marks.'],
 ['The map is not the territory','Models simplify reality and can mislead.','Find one number at work that hides what is really happening.'],
 ['Compounding','Small gains repeated grow exponentially.','Identify one 1% improvement you can repeat daily.'],
 ['Incentives','Show me the incentive and I’ll show you the outcome.','Explain one person’s behaviour today purely through incentives.'],
 ['Confirmation bias','We seek evidence that agrees with us.','Read one argument against your strongest opinion.'],
 ['Sunk cost fallacy','Past costs should not drive future decisions.','Drop one thing you continue only because you started it.'],
 ['Regression to the mean','Extreme results tend to be followed by average ones.','Spot one “hot streak” claim in the news today.'],
 ['Base rates','Start with how often something usually happens.','Before a prediction, look up the base rate first.'],
 ['Feedback loops','Outputs feed back into inputs and amplify or dampen.','Name one habit loop that feeds itself in your day.'],
 ['Leverage','Small input, large output, in both directions.','Find one task where 10 minutes gives an hour of value.'],
 ['Survivorship bias','We only see the winners who survived.','Ask what the failures in a success story did differently.'],
 ['Asymmetric risk','Prefer bets with small downside and large upside.','Find one action today with limited downside and big upside.'],
 ['Probabilistic thinking','Think in odds, not certainties.','Put a % on one outcome you’re expecting this week.'],
 ['Bottlenecks','A system moves only as fast as its slowest part.','Find the bottleneck in your morning routine.'],
 ['Skin in the game','Trust advice from people who bear the consequences.','Check whether one adviser you listen to loses if wrong.'],
 ['Via negativa','Improve by removing, not adding.','Remove one thing from your day instead of adding one.'],
 ['Lindy effect','The longer something has lasted, the longer it’s likely to last.','Swap one new article for an old classic text today.'],
 ['Anchoring','The first number you hear distorts your judgement.','Notice one anchor in a price or negotiation today.'],
 ['Availability heuristic','We overrate what comes easily to mind.','Question one fear that is driven by recent news.'],
 ['Steelmanning','Argue the strongest version of the other side.','Steelman a view you disagree with in 3 sentences.'],
 ['Chesterton’s fence','Don’t remove a rule until you know why it exists.','Find out the reason behind one process you find pointless.'],
 ['Thought experiment','Test ideas by imagining them carried out.','Imagine your career if you read 50 books a year for 5 years.']
];
const TOPICS=[
 'Is cash still king in a UPI world?','Should India move to a 4-day work week?','Explain inflation to a 10-year-old','The best decision you ever made',
 'Why most people stop reading after college','Is social media making us smarter or dumber?','One thing you would change about Indian banking',
 'Defend a habit everyone thinks is bad','Why smart people make bad money decisions','The one skill schools should teach',
 'Is ambition overrated?','Explain a credit default swap simply','What makes a great leader?','Should AI replace bank tellers?',
 'Argue for and against working from home','What success means at 40','The most underrated city in India','Why we procrastinate',
 'Is it better to be liked or respected?','Explain the stock market with a cricket analogy','Should college be free?',
 'What would you do with an extra hour every day?','Is luck more important than skill?','Explain risk versus uncertainty',
 'Why people believe rumours','A book everyone should read','What you would tell your 20-year-old self','Is the 9-to-5 dying?',
 'Why some countries get rich and others don’t','Defend the opposite of your strongest opinion'
];
const TITLES=[
 {id:'awakened',name:'Awakened',desc:'Clear your first full day',test:s=>s.best>=1},
 {id:'unbroken',name:'Unbroken',desc:'7-day streak',test:s=>s.best>=7},
 {id:'ironwill',name:'Iron Will',desc:'30-day streak',test:s=>s.best>=30},
 {id:'storyteller',name:'Storyteller',desc:'Eloquence 500',test:s=>s.stats.ELO>=500},
 {id:'debater',name:'Debater',desc:'5 impromptu talks',test:s=>s.counts.impromptu>=5},
 {id:'essayist',name:'Essayist',desc:'10 essays written',test:s=>s.counts.essay>=10},
 {id:'wordsmith',name:'Wordsmith',desc:'100 words learned',test:s=>wordCount(s)>=100},
 {id:'analyst',name:'Analyst',desc:'Intellect 1,000',test:s=>s.stats.INT>=1000},
 {id:'monk',name:'Monk Mode',desc:'Focus 750',test:s=>s.stats.FOC>=750},
 {id:'raider',name:'Raid Clearer',desc:'Clear a Boss Raid',test:s=>s.raids.some(r=>r.cleared)}
];

/* ---------- state ---------- */
const KEY='ascend.v1';
const START='2026-11-23';
function fresh(){const t=dkey();return{v:1,player:'Shubham',createdAt:t>START?t:START,lastProcessed:t,startFix:true,lastGreeted:'',xp:0,
 stats:{INT:0,ELO:0,FOC:0,DIS:0,VIT:0},streak:0,best:0,days:{},weeks:{},penalty:null,custom:[],raids:[],
 study:[],counts:{impromptu:0,speak:0,essay:0},titles:[],activeTitle:'',log:[],thoughts:[],frag:null,quizLog:[],treeSeen:0,updatedAt:0}}
function migrate(s){
 if(!s.startFix){s.raids=(s.raids||[]).filter(r=>r.id!=='frm2');s.quizLog=(s.quizLog||[]).filter(q=>q.raid!=='frm2');
  (s.study||[]).forEach(e=>{if(e.raid==='frm2')e.raid=null});if(!s.createdAt||s.createdAt<START)s.createdAt=START;s.penalty=null;s.streak=0;s.startFix=true}
 const f=fresh();for(const k in f)if(s[k]===undefined)s[k]=f[k];for(const k in f.stats)if(s.stats[k]==null)s.stats[k]=0;for(const k in f.counts)if(s.counts[k]==null)s.counts[k]=0;return s}
let S=null;
try{const raw=localStorage.getItem(KEY);if(raw)S=migrate(JSON.parse(raw))}catch(e){}
if(!S)S=fresh();

let remote=null, remoteCol=null, writing=Promise.resolve(), saveTimer=null, lastParts=[];
let sampleNs=null, dlNs=null;
function save(){
 S.updatedAt=Date.now();
 try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
 if(remote){clearTimeout(saveTimer);saveTimer=setTimeout(pushRemote,900)}
}
// The whole state is split into ~90 KB parts so it never hits the per-document size cap.
function pushRemote(){
 if(!remote)return;
 const json=JSON.stringify(S),parts=[];for(let i=0;i<json.length;i+=90000)parts.push(json.slice(i,i+90000));
 const upd=S.updatedAt;
 writing=writing.then(async()=>{
  for(let i=0;i<parts.length;i++)if(lastParts[i]!==parts[i]){await remoteCol.doc('part-'+i).set({json:parts[i]});lastParts[i]=parts[i]}
  lastParts.length=parts.length;
  await remote.set({parts:parts.length,updatedAt:upd,v:2});
 }).then(()=>setSync('on','Synced to your account')).catch(()=>setSync('warn','Saved on this device; cloud sync failed'));
}
function setSync(cls,t){const el=$('#sync');el.className='sync '+(cls||'');el.title=t;syncText=t}

/* ---------- game logic ---------- */
const today=()=>dkey();
const dayRec=k=>(S.days[k]||(S.days[k]={done:{}}));
const weekRec=k=>(S.weeks[k]||(S.weeks[k]={done:{}}));
const levelOf=xp=>Math.floor((1+Math.sqrt(1+4*xp/50))/2);
const needFor=L=>50*L*(L-1);
const dailyDone=d=>DAILY.every(q=>d&&d.done&&d.done[q.id]!=null);
const penaltyActive=()=>!!(S.penalty&&S.penalty.date===today()&&!S.penalty.done);
function wordCount(s){let n=0;for(const k in s.days)n+=(s.days[k].words||[]).length;return n}
function rankIdx(){const L=levelOf(S.xp),minStat=Math.min(...Object.values(S.stats));let r=0;for(let i=0;i<RANKS.length;i++)if(L>=RANK_LV[i]&&minStat>=RANK_STAT[i])r=i;return r}
function sys(t){S.log.unshift({d:today(),t});S.log=S.log.slice(0,40)}
function toast(t,bad){const el=$('#toast');el.textContent=t;el.className=bad?'bad':'';el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600)}
function addXP(stat,amt){
 const before=levelOf(S.xp),rb=rankIdx();
 S.xp=Math.max(0,S.xp+amt);S.stats[stat]=Math.max(0,S.stats[stat]+amt);
 const after=levelOf(S.xp),ra=rankIdx();
 if(amt>0&&typeof xpFloat==='function')xpFloat(stat,amt);
 if(ra>rb){sys('Rank up. You are now '+RANKS[ra]+'-rank.');cinematic('rank',RANKS[ra])}
 else if(after>before){sys('Level up. You are now Lv '+after+'.');cinematic('level',after)}
 else if(after<before)toast('Level lost · LV '+after,true);
 if(ra<rb)toast('Rank lost · '+RANKS[ra],true);
}
function checkTitles(){for(const t of TITLES)if(!S.titles.includes(t.id)&&t.test(S)){S.titles.push(t.id);if(!S.activeTitle)S.activeTitle=t.id;sys('Title unlocked: '+t.name+'.');toast('TITLE UNLOCKED · '+t.name)}}

function processDays(){
 const t=today();let k=S.lastProcessed;let changed=false;
 while(k<t){
  if(k>=S.createdAt){
   const d=S.days[k]||{done:{}};
   if(S.penalty&&S.penalty.date===k&&!S.penalty.done){S.xp=Math.max(0,S.xp-100);S.stats.DIS=Math.max(0,S.stats.DIS-50);sys('Penalty ignored on '+fmt(k)+'. −100 XP, −50 Discipline.');S.penalty=null}
   if(d.rest||dailyDone(d)){if(!d.rest){S.streak++;S.best=Math.max(S.best,S.streak)}}
   else{S.streak=0;S.xp=Math.max(0,S.xp-100);sys('Daily quests failed on '+fmt(k)+'. −100 XP. Streak reset.');
    S.penalty={text:PENALTIES[dayIdx(k)%PENALTIES.length],date:addDays(k,1),done:false}}
  }
  k=addDays(k,1);changed=true;
 }
 S.lastProcessed=t;
 // prune old day records (keep ~1 year)
 const cut=addDays(t,-370);for(const key in S.days)if(key<cut)delete S.days[key];
 if(changed){checkTitles();save()}
}

function questById(id,scope){return(scope==='d'?[...DAILY,AUTO_D]:[...WEEKLY,AUTO_W]).find(q=>q.id===id)||S.custom.find(q=>q.id===id)}
function complete(q,scope,payload){
 const t=today(),day=dayRec(t),wk=weekRec(weekKey(t));
 const gain=Math.round(q.xp*(penaltyActive()?0.5:1));
 (scope==='d'?day.done:wk.done)[q.id]=gain;
 addXP(q.stat,gain);
 if(q.id==='words')day.words=payload.words;
 if(q.id==='speak'){day.speak={topic:payload.topic,fillers:payload.fillers};S.counts.speak++}
 if(q.id==='journal')day.journal={learned:payload.learned,improve:payload.improve};
 if(q.id==='model')day.modelNote=payload.note;
 if(q.id==='impromptu'){wk.impromptu={topic:payload.topic,fillers:payload.fillers};S.counts.impromptu++}
 if(q.id==='review')wk.review={wins:payload.wins,fix:payload.fix};
 if(q.id==='essay')S.counts.essay++;
 if(scope==='d'&&!day.bonus&&dailyDone(day)){day.bonus=20;addXP('DIS',20);sys('All daily quests cleared. +20 Discipline bonus.');toast('DAILY QUESTS CLEARED')}
 openQ=null;justDone=scope+':'+q.id;sfx.quest();checkTitles();save();render();justDone=null;
}
function undo(q,scope){
 const t=today(),day=dayRec(t),wk=weekRec(weekKey(t)),map=scope==='d'?day.done:wk.done;
 const gain=map[q.id]||0;delete map[q.id];addXP(q.stat,-gain);
 if(q.id==='speak')S.counts.speak=Math.max(0,S.counts.speak-1);
 if(q.id==='impromptu')S.counts.impromptu=Math.max(0,S.counts.impromptu-1);
 if(q.id==='essay')S.counts.essay=Math.max(0,S.counts.essay-1);
 if(scope==='d'&&day.bonus&&!dailyDone(day)){addXP('DIS',-day.bonus);delete day.bonus}
 save();render();
}

function qtan(p0,p1,p2,s){return{x:2*(1-s)*(p1.x-p0.x)+2*s*(p2.x-p1.x),y:2*(1-s)*(p1.y-p0.y)+2*s*(p2.y-p1.y)}}

 introStart:null,budAt:0,seen:0,lapse:null,reduce:false,ptrs:new Map(),moved:false,down:null,pinch:null,lastTap:0,last:0,dirty:true,phase:'night',season:null,sprites:{}};
function sprite(rgb,r){const key=rgb+'|'+r;if(TREE.sprites[key])return TREE.sprites[key];
 const c=document.createElement('canvas');c.width=c.height=r*2;const x=c.getContext('2d'),g=x.createRadialGradient(r,r,0,r,r,r);

/* debate sparring */
function debateRules(){return`We're doing a debate sparring drill to make me a sharper, more articulate speaker. Topic: "${dojo.topic}". I argue ${dojo.side==='for'?'FOR':'AGAINST'} it. You argue the opposite side as a sharp, fair, persuasive opponent.
Rules for every reply: under 120 words; one or two strong points; directly attack the weakest part of my last argument; plain conversational English; no lists, no headings, no hedging; stay in character and don't coach me until I ask for a verdict.`}
function vDebate(){
 const T=dojo.turns,userN=T.filter(t=>t.role==='user').length;
 if(dojo.res){const r=dojo.res,w=r.winner==='you'?'You won':r.winner==='claude'?'Claude won':'Draw';
  return`<section class="win glow corner"><div class="win-h">Verdict<span class="r">${esc(w)}</span></div><div class="win-b"><div style="font-weight:600">${esc(r.verdict||'')}</div>${scoreBars(r.scores)}</div></section>

 if(!T.length&&!dojo.busy)return`<section class="win glow"><div class="win-h">Debate sparring</div><div class="win-b">
  <div class="note">Claude takes the other side and attacks your weakest point every round. Up to 5 rounds, then a verdict.</div>
  <label class="note">Motion<input type="text" id="dj-topic" value="${esc(dojo.topic)}"></label>
  <div class="btns"><button class="btn ghost sm" data-act="dtopic">Random motion</button></div>
  <div class="chips"><button data-act="dside" data-v="for" class="${dojo.side==='for'?'on':''}">I argue for</button><button data-act="dside" data-v="against" class="${dojo.side==='against'?'on':''}">I argue against</button></div>
  <label class="note">Your opening argument<textarea id="dj-text" style="min-height:130px">${esc(dojo.text)}</textarea></label>
  ${dojo.err?`<div class="err">${esc(dojo.err)}</div>`:''}
  <div class="btns"><button class="btn" data-act="dsend">Open the debate</button><button class="btn ghost" data-act="dclaudeopen">Let Claude open</button></div></div></section>`;
 const bubbles=T.filter(t=>!t.hidden).map(t=>`<div class="bub ${t.role==='user'?'me':'ai'}"><small>${t.role==='user'?'You':'Opponent'}</small>${esc(t.content)}</div>`).join('')+(dojo.busy?`<div class="bub ai"><small>Opponent</small><span id="dj-stream">${esc(dojo.stream||'Thinking…')}</span></div>`:'');
 return`<section class="win"><div class="win-h">${esc(snippet(dojo.topic,48))}<span class="r">Round ${Math.max(1,userN)} / 5 · you argue ${dojo.side}</span></div>
  <div class="win-b"><div class="chat">${bubbles}</div></div></section>
  ${dojo.err?`<div class="err">${esc(dojo.err)}</div>`:''}
  ${dojo.busy?`<div class="btns"><button class="btn ghost sm" data-act="dstop">Stop</button></div>`:userN>=5?
   `<div class="btns"><button class="btn" data-act="dverdict">Get the verdict</button></div>`:
   `<label class="note">Your rebuttal<textarea id="dj-text" style="min-height:110px">${esc(dojo.text)}</textarea></label>
   <div class="btns"><button class="btn" data-act="dsend">Send</button>${userN>=1&&T.some(t=>t.role==='assistant')?'<button class="btn ghost" data-act="dverdict">End and get verdict</button>':''}</div>`}`;
}
function debateTurn(){

 });

/* word recall (spaced repetition) */
function loggedWords(){const m=new Map();Object.keys(S.days).sort().forEach(k=>(S.days[k].words||[]).forEach(w=>{const key=w.trim().toLowerCase();if(key&&!m.has(key))m.set(key,{word:w.trim(),date:k})}));return m}
function dueWords(){
 S.vocab=S.vocab||{};const t=today(),out=[];
 loggedWords().forEach((v,key)=>{const st=S.vocab[key]||{box:0,next:addDays(v.date,2)};if(st.next<=t)out.push({key,word:v.word,box:st.box})});
 return out.sort((a,b)=>a.box-b.box).slice(0,5);
}
function vRecall(){
 if(dojo.busy)return busyCard('The System is checking your answers.');
 if(dojo.res)return`<section class="win glow corner"><div class="win-h">Recall results<span class="r">${dojo.res.filter(x=>x.verdict==='correct').length}/${dojo.res.length}</span></div><div class="win-b"><div class="list">
  ${dojo.res.map(x=>`<div class="li" style="flex-direction:column;gap:4px"><div><b style="font-family:var(--display);font-size:17px">${esc(x.word)}</b> <span class="chip" style="color:${x.verdict==='correct'?'var(--ok)':x.verdict==='partial'?'var(--gold)':'var(--danger)'};border-color:currentColor">${esc(x.verdict)}</span></div>
   <div>${esc(x.meaning||'')}</div><div class="note">${esc(x.feedback||'')}</div>${x.example?`<div class="quote">${esc(x.example)}</div>`:''}</div>`).join('')}
  </div><div class="note">Correct words come back later and later. Missed words come back tomorrow.</div></div></section>`;
 const d=dojo.due;
 if(!d.length){const total=loggedWords().size;return`<section class="win"><div class="win-h">Word recall</div><div class="win-b"><div class="note">${total?'No words are due today. Words you log come back for review after 2 days, then at growing intervals.':'Log words in your daily words quest first. They come back here for review after 2 days.'}</div></div></section>`}
 return`<section class="win glow"><div class="win-h">Word recall<span class="r">${d.length} due</span></div><div class="win-b">
  <div class="note">For each word, write what it means or use it in a sentence. No peeking.</div>
  ${d.map((w,i)=>`<label class="note"><b style="font-family:var(--display);font-size:18px;color:var(--fg)">${esc(w.word)}</b><input type="text" id="dj-w${i}" placeholder="Meaning or a sentence"></label>`).join('')}
  ${dojo.err?`<div class="err">${esc(dojo.err)}</div>`:''}
  <div class="btns"><button class="btn" data-act="drecall">Check my answers</button></div></div></section>`;
}
function runRecall(){
 const d=dojo.due,ans=d.map((w,i)=>({word:w.word,answer:val('dj-w'+i)}));
 if(ans.every(a=>!a.answer)){dojo.err='Answer at least one word.';renderDojo();return}
 dojoAsk(async sig=>{
  const res=await sampleNs.json(`Check this vocabulary review. For each word, the learner wrote either its meaning or a sentence using it (blank means they didn't remember). Mark "correct" if the meaning or usage is right, "partial" if close but imprecise or slightly misused, "wrong" if wrong or blank.
Reply with only a JSON array in the same order: [{"word":"...","verdict":"correct|partial|wrong","meaning":"precise meaning in under 15 words","feedback":"one short line on their answer","example":"one natural example sentence"}]

${JSON.stringify(ans)}`,{signal:sig,cache:false,modelTier:'quick'});
  if(!Array.isArray(res))throw{code:'invalid_json'};
  const t=today(),gaps=[1,3,7,14,30,60];let ok=0;S.vocab=S.vocab||{};
  dojo.res=d.map((w,i)=>{const r=res[i]||{word:w.word,verdict:'wrong'};const st=S.vocab[w.key]||{box:0};
   if(r.verdict==='correct'){st.box=Math.min(5,st.box+1);ok++}else if(r.verdict==='partial'){st.box=Math.max(0,st.box)}else st.box=0;
   st.next=addDays(t,r.verdict==='correct'?gaps[st.box]:1);S.vocab[w.key]=st;return{...r,word:w.word}});
  addXP('INT',ok*4);toast('+'+ok*4+' INT · '+ok+'/'+d.length+' recalled');save();
 });
}

/* rank sigil */
function sigil(ri,size=70){
 const col=RANK_HEX[RANKS[ri]],c=50,sides=[4,4,6,6,8,12][ri];
 const poly=(r,n,rot)=>[...Array(n)].map((_,i)=>{const a=rot+i*2*Math.PI/n;return(c+r*Math.sin(a)).toFixed(1)+','+(c-r*Math.cos(a)).toFixed(1)}).join(' ');
 let g=`<polygon points="${poly(30,sides,0)}" fill="rgba(${hexRgb(col)},.12)" stroke="${col}" stroke-width="2"/>`;
 if(ri>=1)g+=`<polygon points="${poly(20,sides,Math.PI/sides)}" fill="none" stroke="${col}" stroke-width="1" opacity=".7"/>`;
 if(ri>=2)g+=`<g class="sg-spin"><circle cx="50" cy="50" r="39" fill="none" stroke="${col}" stroke-width="1" stroke-dasharray="3 5" opacity=".7"/></g>`;
 if(ri>=3)g+=[...Array(sides)].map((_,i)=>{const a=i*2*Math.PI/sides;return`<circle cx="${(c+39*Math.sin(a)).toFixed(1)}" cy="${(c-39*Math.cos(a)).toFixed(1)}" r="1.8" fill="${col}"/>`}).join('');
 if(ri>=4)g+=`<g class="sg-spin rev">${[...Array(16)].map((_,i)=>{const a=i*Math.PI/8;return`<line x1="${(c+43*Math.sin(a)).toFixed(1)}" y1="${(c-43*Math.cos(a)).toFixed(1)}" x2="${(c+48*Math.sin(a)).toFixed(1)}" y2="${(c-48*Math.cos(a)).toFixed(1)}" stroke="${col}" stroke-width="1.4"/>`}).join('')}</g>`;
 if(ri>=5)g+=`<polygon points="${poly(46,5,0)}" fill="none" stroke="${col}" stroke-width=".8" opacity=".6"/>`;
 return`<svg class="sigil" viewBox="0 0 100 100" width="${size}" height="${size}" aria-label="Rank ${RANKS[ri]}" style="filter:drop-shadow(0 0 8px rgba(${hexRgb(col)},.55))">${g}
  <text x="50" y="51" text-anchor="middle" dominant-baseline="middle" font-family="Chakra Petch, sans-serif" font-weight="700" font-size="30" fill="${col}">${RANKS[ri]}</text></svg>`;
}

/* stat radar */
function radar(){
 const keys=Object.keys(STATS),ri=rankIdx(),nx=ri<5?RANK_STAT[ri+1]:Math.max(...Object.values(S.stats));
 const max=Math.max(50,nx,...Object.values(S.stats))*1.08,cx=170,cy=128,R=88;
 const pt=(i,v)=>{const a=i*2*Math.PI/5;return[cx+R*v*Math.sin(a),cy-R*v*Math.cos(a)]};
 const ring=f=>keys.map((_,i)=>pt(i,f).map(n=>n.toFixed(1)).join(',')).join(' ');
 const me=keys.map((k,i)=>pt(i,Math.max(0.03,S.stats[k]/max)).map(n=>n.toFixed(1)).join(',')).join(' ');
 const gate=ri<5?keys.map((_,i)=>pt(i,nx/max).map(n=>n.toFixed(1)).join(',')).join(' '):'';
 return`<div style="overflow-x:auto"><svg viewBox="0 0 340 262" width="100%" style="max-width:400px;display:block;margin:0 auto" role="img" aria-label="Stat radar: ${keys.map(k=>STATS[k]+' '+S.stats[k]).join(', ')}">
  ${[0.25,0.5,0.75,1].map(f=>`<polygon points="${ring(f)}" fill="none" stroke="var(--line)" stroke-width="1"/>`).join('')}
  ${keys.map((_,i)=>{const[x,y]=pt(i,1);return`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`}).join('')}
  ${gate?`<polygon points="${gate}" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 4"/>`:''}
  <polygon points="${me}" fill="var(--accent)" fill-opacity=".2" stroke="var(--accent)" stroke-width="2" style="filter:drop-shadow(0 0 6px var(--glow))"/>
  ${keys.map((k,i)=>{const[x,y]=pt(i,Math.max(0.03,S.stats[k]/max));return`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${STAT_HEX[k]}"/>`}).join('')}
  ${keys.map((k,i)=>{const[x,y]=pt(i,1.2),anc=Math.abs(x-cx)<10?'middle':x>cx?'start':'end';
   return`<text x="${x.toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="${anc}" font-family="Chakra Petch, sans-serif" font-weight="600" font-size="12" fill="${STAT_HEX[k]}">${STATS[k]}</text>
   <text x="${x.toFixed(1)}" y="${(y+10).toFixed(1)}" text-anchor="${anc}" font-family="JetBrains Mono, monospace" font-size="11" fill="var(--fg)">${S.stats[k]}</text>`}).join('')}
 </svg></div>${gate?`<div class="note" style="text-align:center">Dashed line: what rank ${RANKS[ri+1]} needs in every stat.</div>`:''}`;
}

/* discipline heatmap */
function dayLevel(k){
 const t=today();if(k>t)return'fut';if(k<S.createdAt)return'pre';
 const d=S.days[k];if(d&&d.rest)return'rest';
 const n=d?DAILY.filter(q=>d.done&&d.done[q.id]!=null).length:0;
 if(k<t&&n<DAILY.length)return'fail';
 if(n>=DAILY.length)return'l4';return n===0?'l0':n<3?'l1':n<5?'l2':'l3';
}
function heatmap(){

 for(let i=0;i<W*7;i++){const k=addDays(start,i),lv=dayLevel(k);cells+=`<button class="hm ${lv}${k===t?' now':''}" data-act="hm" data-k="${k}" aria-label="${fmt(k)}: ${lv}"></button>`}
 const done=Object.keys(S.days).filter(k=>dayLevel(k)==='l4').length;
 return`<section class="win"><div class="win-h">Discipline record<span class="r">${done} perfect day${done===1?'':'s'}</span></div><div class="win-b">
  <div class="hmwrap"><div class="hmdays"><span>M</span><span></span><span>W</span><span></span><span>F</span><span></span><span>S</span></div><div class="hmgrid">${cells}</div></div>

  <div class="note" id="hmInfo">Tap a day to see it.</div></div></section>`;
}

/* living background */
const BG={cv:null,c:null,parts:[],rgb:'143,168,216',last:0,off:0,raf:0};
function bgInit(){
 BG.cv=$('#bgfx');BG.c=BG.cv.getContext('2d');bgSize();
 BG.parts=[...Array(26)].map(()=>({x:Math.random(),y:Math.random(),v:0.00006+Math.random()*0.00012,r:0.6+Math.random()*1.4,ph:Math.random()*6.28}));
 addEventListener('resize',bgSize);BG.raf=requestAnimationFrame(bgFrame);
}
function bgSize(){const d=Math.min(2,devicePixelRatio||1);BG.cv.width=innerWidth*d;BG.cv.height=innerHeight*d;BG.c.setTransform(d,0,0,d,0,0);BG.last=0}
function bgFrame(now){
 BG.raf=requestAnimationFrame(bgFrame);
 if(document.hidden||(TREE&&TREE.running))return;
 if(now-BG.last<33&&BG.last)return;const dt=BG.last?now-BG.last:16;BG.last=now;
 if(REDUCE&&BG.drawn)return;BG.drawn=true;
 const c=BG.c,W=innerWidth,H=innerHeight;c.clearRect(0,0,W,H);
 BG.off=(BG.off+dt*0.006)%44;
 c.strokeStyle=`rgba(${BG.rgb},.045)`;c.lineWidth=1;c.beginPath();
 for(let x=(W/2)%44;x<W;x+=44){c.moveTo(x+.5,0);c.lineTo(x+.5,H)}
 for(let y=-44+BG.off;y<H;y+=44){c.moveTo(0,y+.5);c.lineTo(W,y+.5)}c.stroke();
 BG.parts.forEach(p=>{p.y-=p.v*dt;if(p.y<-0.02){p.y=1.02;p.x=Math.random()}
  const a=0.18+0.18*Math.sin(now*0.001+p.ph);c.fillStyle=`rgba(${BG.rgb},${a})`;c.beginPath();c.arc(p.x*W,p.y*H,p.r,0,6.283);c.fill()});
}

 if(a==='drecall'){runRecall();return}
 if(a==='dreport'){runReport();return}
 if(a==='daddquest'){const r=dojo.res||(S.reports||{})[weekKey(today())]||Object.values(S.reports||{}).pop();const q=r&&r.quest;if(!q)return;
  S.custom.push({id:'c'+uid(),name:String(q.name).slice(0,80),stat:STATS[q.stat]?q.stat:'DIS',xp:[10,20,30,50,80].includes(+q.xp)?+q.xp:20,freq:q.freq==='weekly'?'weekly':'daily'});toast('Quest added');save();renderDojo();return}
 /* quiz */
 if(a==='quiz'){if(sampleNs)startQuiz(b.dataset.raid,+b.dataset.i);return}
 if(a==='quizstop'){quiz&&quiz.ctl.abort();return}
 if(a==='quizagain'){if(quiz)startQuiz(quiz.rid,quiz.i);return}
 if(a==='quizclose'){if(quiz&&quiz.ctl)quiz.ctl.abort();quiz=null;$('#quizOv').hidden=true;document.body.style.overflow='';render();return}
 if(a==='qpick'){if(!quiz||quiz.picked!=null)return;quiz.picked=+b.dataset.j;if(quiz.picked===quiz.qs[quiz.cur].answer)quiz.score++;renderQuiz();return}
 if(a==='qnext'){if(!quiz)return;quiz.cur++;quiz.picked=null;
  if(quiz.cur>=quiz.qs.length){quiz.done=true;addXP('INT',quiz.score*5);S.quizLog.unshift({date:today(),raid:quiz.rid,i:quiz.i,score:quiz.score,total:quiz.qs.length});S.quizLog=S.quizLog.slice(0,300);
   sys('Quiz on '+snippet(quiz.title,30)+': '+quiz.score+'/'+quiz.qs.length+'.');checkTitles();save()}
  renderQuiz();$('#quizOv .ov-body').scrollTop=0;return}
 if(a==='toggle'){
  const q=questById(b.dataset.id,b.dataset.scope);if(!q)return;
  if(q.auto){toast(q.id==='thought'?'Save a thought in Mind to clear this':'Mark a thought as a fruit in Mind to clear this');return}
  const t=today(),map=b.dataset.scope==='d'?dayRec(t).done:weekRec(weekKey(t)).done;
  if(map[q.id]!=null)return undo(q,b.dataset.scope);
  if(q.input){openQ=b.dataset.scope+':'+q.id;render();return}
  return complete(q,b.dataset.scope,{});
 }
 if(a==='cancel'){openQ=null;render();return}
 if(a==='topic'){curTopic=TOPICS[Math.floor(Math.random()*TOPICS.length)];render();return}
 if(a==='submit'){
  const q=questById(b.dataset.id,b.dataset.scope),p={};
  if(q.id==='words'){const nw=WORDN(rankIdx());p.words=[...Array(nw)].map((_,i)=>val('w'+(i+1))).filter(Boolean);if(p.words.length<nw)return showErr('perr','Add all '+nw+' words to clear this quest.')}
  if(q.id==='speak'){p.topic=val('sp-topic');p.fillers=val('sp-fill');if(p.fillers==='')return showErr('perr','Enter your filler count. Zero is fine if you earned it.');p.fillers=+p.fillers}
  if(q.id==='journal'){p.learned=val('j1');p.improve=val('j2');if(!p.learned||!p.improve)return showErr('perr','Fill in both lines.')}
  if(q.id==='model'){p.note=val('mn');if(!p.note)return showErr('perr','Write one line on where you used it.')}
  if(q.id==='impromptu'){p.topic=curTopic;p.fillers=+(val('im-fill')||0);curTopic=null}
  if(q.id==='review'){p.wins=val('r1');p.fix=val('r2');if(!p.wins||!p.fix)return showErr('perr','Fill in both parts of the review.')}
  return complete(q,b.dataset.scope,p);
 }
 if(a==='penalty'){S.penalty.done=true;sys('Penalty cleared. Full XP restored.');toast('PENALTY CLEARED');save();render();return}
 if(a==='rest'){
  if(delArm!=='rest'){delArm='rest';render();setTimeout(()=>{if(delArm==='rest'){delArm=null;render()}},4000);return}
  delArm=null;const t=today();dayRec(t).rest=true;weekRec(weekKey(t)).rest=t;sys('Rest day used.');save();render();return}
 if(a==='stage'){
  const r=S.raids.find(x=>x.id===b.dataset.raid),s=r.stages[+b.dataset.i];
  if(s.done){s.done=false;addXP('INT',-(s.xp||0));s.xp=0;if(r.cleared){r.cleared=false;addXP('INT',-(r.bonus||0));r.bonus=0}}
  else{s.done=true;s.xp=40;addXP('INT',40);
   if(r.stages.every(x=>x.done)&&!r.cleared){r.cleared=true;r.bonus=300;addXP('INT',300);sys('Boss Raid cleared: '+r.name+'. +300 Intellect.');toast('RAID CLEARED · '+r.name)}}
  checkTitles();save();render();return}
 if(a==='delraid'){
  if(delArm!==b.dataset.raid){delArm=b.dataset.raid;render();return}
  S.raids=S.raids.filter(x=>x.id!==b.dataset.raid);delArm=null;save();render();return}
 if(a==='raidform'){raidForm=!raidForm;render();return}
 if(a==='addraid'){
  const n=val('rn'),d=val('rd'),st=($('#rs').value||'').split('\n').map(x=>x.trim()).filter(Boolean),h=+val('rh')||0;
  if(!n)return showErr('rerr','Give the boss a name.');if(!d)return showErr('rerr','Pick a deadline.');if(!st.length)return showErr('rerr','Add at least one stage.');
  S.raids.push({id:uid(),name:n,deadline:d,targetHrs:h,cleared:false,stages:st.map(x=>({n:x,done:false,xp:0}))});
  sys('New Boss Raid: '+n+'.');raidForm=false;save();render();return}
 if(a==='mins'){studyMins=+b.dataset.m;render();return}
 if(a==='logstudy'){
  const m=Math.round(+val('smin'));if(!m||m<1)return showErr('serr','Enter the minutes you studied.');
  if(m>720)return showErr('serr','That’s more than 12 hours in one session. Split it up.');
  const tv=$('#stopic').value;let topic='General study',raid=null;
  if(tv!=='general'){const[rid,i]=tv.split('::');const r=S.raids.find(x=>x.id===rid);if(r){raid=rid;topic=r.stages[+i].n}}
  const xp=Math.round(m/3);S.study.unshift({id:uid(),date:today(),mins:m,topic,raid,xp});S.study=S.study.slice(0,1500);
  addXP('INT',xp);studyMins=m;toast('+'+xp+' INT · '+m+' min logged');checkTitles();save();render();return}
 if(a==='delstudy'){const i=S.study.findIndex(x=>x.id===b.dataset.id);if(i<0)return;addXP('INT',-(S.study[i].xp||0));S.study.splice(i,1);save();render();return}
 if(a==='equip'){S.activeTitle=b.dataset.id;save();render();return}
 if(a==='addcustom'){const n=val('cq');if(!n)return showErr('cerr','Name the quest first.');
  S.custom.push({id:'c'+uid(),name:n,stat:$('#cs').value,xp:+$('#cx').value,freq:$('#cf').value});save();render();return}
 if(a==='delcustom'){S.custom=S.custom.filter(q=>q.id!==b.dataset.id);save();render();return}
 if(a==='rename'){const n=val('pn');if(n){S.player=n.slice(0,30);save();render();toast('Name saved')}return}
 if(a==='accept'){S.lastGreeted=today();save();$('#sys').hidden=true;if(penaltyActive())sfx.penalty();return}
 if(a==='hm'){hmInfo(b.dataset.k);return}
 if(a==='setstart'){const v=val('sd');if(!/^\d{4}-\d{2}-\d{2}$/.test(v))return;S.createdAt=v;if(v>today()){S.penalty=null;S.streak=0}S.lastProcessed=today();toast('Start date saved · '+fmt(v));save();render();return}
 if(a==='reset'){if(delArm!=='reset'){delArm='reset';render();setTimeout(()=>{if(delArm==='reset'){delArm=null;render()}},4000);return}
  delArm=null;const keep={thoughts:S.thoughts,custom:S.custom,raids:S.raids.map(r=>({...r,cleared:false,bonus:0,stages:r.stages.map(x=>({...x,done:false,xp:0}))})),player:S.player,createdAt:S.createdAt>today()?S.createdAt:today(),treeSeen:S.treeSeen};
  S=Object.assign(fresh(),keep);S.lastProcessed=today();sys('The System has been reset. A new journey begins.');save();render();toast('Progress reset');return}
 if(a==='sfx'){SFX.on=b.dataset.v==='1';try{localStorage.setItem('ascend.sfx',SFX.on?'1':'0')}catch(_){}if(SFX.on)sfx.quest();render();return}
});

document.addEventListener('input',e=>{
 const id=e.target.id,v=e.target.value;
 if(id==='tt'){mind.draft=v;try{localStorage.setItem('ascend.draft',v)}catch(_){}}
 else if(id==='ttag'){mind.tagText=v;try{localStorage.setItem('ascend.drafttags',v)}catch(_){}}
 else if(id==='exText')mind.exDraft=v;
 else if(id==='mq'){mind.q=v;const l=$('#mlist');if(l)l.innerHTML=listHtml()}
 else if(dojo&&id==='dj-text'){dojo.text=v}
 else if(dojo&&id==='dj-topic'){dojo.topic=v}
 else if(dojo&&id==='dj-fill'){dojo.fill=v}
});

function greet(){
 if(today()<S.createdAt)return;
 if(S.lastGreeted===today())return;
 const pen=penaltyActive();
 $('#sys').innerHTML=`<div class="win glow corner sysbox"><div class="win-h" style="justify-content:center">System notice</div><div class="win-b">
  <h2>Daily Quest has arrived</h2>
  <p>${DAILY.length} quests. Clear all of them before midnight.</p>
  ${pen?`<p class="warn">You failed yesterday. Penalty Zone is active. Clear the penalty to restore full XP.</p>`:`<p class="warn">Failure to complete will result in a penalty.</p>`}
  <button class="btn" data-act="accept">Accept</button></div></div>`;
 $('#sys').hidden=false;
}

let curDay=today();
function tick(){if(today()!==curDay){curDay=today();openQ=null;processDays();render();greet()}}
setInterval(tick,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();pullRemote()}});

processDays();checkTitles();bgInit();render();greet();

/* ---------- cloud sync ---------- */
async function pullRemote(){
 if(!remote)return;
 try{const snap=await remote.get();
  if(snap.exists){const d=snap.data()||{};
   if((d.updatedAt||0)>(S.updatedAt||0)){
    let st=null;
    if(d.state)st=JSON.parse(JSON.stringify(d.state));
    else if(d.parts){const ps=await Promise.all([...Array(d.parts)].map((_,i)=>remoteCol.doc('part-'+i).get()));
     const strs=ps.map(p=>p.exists?(p.data().json||''):'');st=JSON.parse(strs.join(''));lastParts=strs}
    if(st){S=migrate(st);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}processDays();render()}
   }else if((d.updatedAt||0)<(S.updatedAt||0)||d.state)pushRemote()}
  else pushRemote();
  setSync('on','Synced to your account');
 }catch(e){setSync('warn','Saved on this device; cloud sync unreachable')}
}
(async()=>{
 if(!window.claude||!window.claude.use){setSync('','Saved on this device');return}
 claude.use('sample').then(s=>{sampleNs=s;render()}).catch(()=>{});
 claude.use('downloads').then(d=>{dlNs=d;render()}).catch(()=>{});
 const timer=setTimeout(()=>setSync('warn','Saved on this device; cloud sync unreachable'),10000);
 try{
  const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
  if(!db||!user){clearTimeout(timer);setSync('','Saved on this device');return}
  const id=await user.id();
  if(!id){clearTimeout(timer);setSync('','Saved on this device');return}
  remoteCol=db.collection('data/users/'+id);
  remote=remoteCol.doc('state');
  await pullRemote();clearTimeout(timer);
 }catch(e){clearTimeout(timer);setSync('warn','Saved on this device; cloud sync unreachable')}
})();
</script>
